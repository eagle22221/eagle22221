[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vex"
version = "0.1.0"
description = "Static reverse-engineering toolkit for Linux (ELF) and Windows (PE) binaries"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["capstone>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vex = "vex.cli:main"

[tool.setuptools.packages.find]
include = ["vex*"]

[tool.setuptools.package-data]
vex = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/*.png", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
