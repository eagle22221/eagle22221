[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "binspect"
version = "0.1.0"
description = "Static reverse-engineering toolkit for Linux (ELF) and Windows (PE) binaries"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["capstone>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
binspect = "binspect.cli:main"

[tool.setuptools.packages.find]
include = ["binspect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
