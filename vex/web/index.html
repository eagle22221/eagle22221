<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vex</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-logo" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="24" height="24" rx="3.5"/>
    <path d="M2 9.5h24M9.5 9.5v16.5M9.5 17.5h16.5"/>
    <path d="M12 26l13.6-8.5M16.5 26l9.5-5.9M21.5 26l4.5-2.8" stroke-width="1"/>
  </symbol>
  <symbol id="i-overview" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M3.5 9h17M9 9v11"/>
  </symbol>
  <symbol id="i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/>
  </symbol>
  <symbol id="i-strings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 7.5h12M6 12h9M6 16.5h6"/>
  </symbol>
  <symbol id="i-imports" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v8.6M8.4 9.4l3.6 3.6 3.6-3.6M5 19h14"/>
  </symbol>
  <symbol id="i-sections" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5l8.5 4.2-8.5 4.2-8.5-4.2 8.5-4.2zM3.5 12l8.5 4.2 8.5-4.2M3.5 16l8.5 4.2 8.5-4.2"/>
  </symbol>
  <symbol id="i-bytes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/>
  </symbol>
  <symbol id="i-assets" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/>
    <circle cx="8.8" cy="10" r="1.5" fill="currentColor" stroke="none"/>
    <path d="M20 14.5l-4.6-4L7 18.6"/>
  </symbol>
  <symbol id="i-modify" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13.6 6.4l4 4M4 20l1-4.2L15.7 5.1a1.9 1.9 0 0 1 2.7 0l.5.5a1.9 1.9 0 0 1 0 2.7L8.2 19 4 20z"/>
  </symbol>
  <symbol id="i-techniques" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5l7 2.6v5.4c0 4.4-3 7.7-7 9-4-1.3-7-4.6-7-9V6.1l7-2.6z"/>
    <path d="M12 8.5v4.2M12 15.6v.1"/>
  </symbol>
  <symbol id="i-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7.5a2 2 0 0 1 2-2h3.3a2 2 0 0 1 1.6.8l.8 1.1H18a2 2 0 0 1 2 2v6.1a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7.5z"/>
    <path d="M12 11v5M9.5 13.5h5"/>
  </symbol>
</svg>

<div class="app">
  <aside class="rail">
    <div class="rail-logo" aria-hidden="true"><svg class="rail-mark" viewBox="0 0 28 28"><use href="#i-logo"></use></svg></div>
    <div class="rail-spacer"></div>
    <button type="button" class="rail-btn" id="rail-open" aria-label="Open file or folder">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-open"></use></svg>
    </button>
  </aside>

  <aside class="sidebar">
    <div class="sidebar-head">
      <span class="brand-name">vex</span>
      <span class="brand-sub">binary inspector</span>
    </div>
    <nav class="nav" id="nav" hidden aria-label="Views"></nav>
  </aside>

  <div class="content">
    <header class="bar">
      <div class="bar-file" id="bar-file" hidden>
        <span class="bar-file-name" id="file-name"></span>
        <span class="bar-file-path" id="file-path"></span>
      </div>
      <form class="goto" id="goto" hidden>
        <label class="sr-only" for="goto-input">Go to an address or name</label>
        <input id="goto-input" type="text" autocomplete="off" spellcheck="false"
               placeholder="Go to address or name, e.g. main or 0x401000">
      </form>
      <div class="bar-actions">
        <button type="button" class="btn" id="theme-toggle" aria-pressed="false">Dark</button>
        <button type="button" class="btn btn-primary" id="open-button">Open file or folder</button>
      </div>
    </header>

    <section class="map" id="map" hidden aria-label="File layout, drawn to scale">
      <div class="map-strip" id="map-strip"></div>
      <div class="map-scale" id="map-scale"></div>
      <div class="map-legend" id="map-legend"></div>
    </section>

    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>

<dialog class="dialog" id="open-dialog" aria-labelledby="open-title">
  <form method="dialog" class="dialog-head">
    <h2 id="open-title">Open a program, game folder or asset pack</h2>
    <button class="btn" value="cancel">Close</button>
  </form>
  <form class="path-row" id="path-form">
    <label class="sr-only" for="path-input">Path</label>
    <input id="path-input" type="text" spellcheck="false" autocomplete="off" placeholder="Type or paste a path">
    <button class="btn btn-primary">Open</button>
  </form>
  <div class="places" id="places"></div>
  <div class="browser" id="browser" role="listbox" aria-label="Files in this folder"></div>
  <p class="dialog-hint">Files are read from this computer and stay on it. Nothing is uploaded anywhere and nothing is run.</p>
</dialog>

<dialog class="dialog dialog-small" id="ask-dialog" aria-labelledby="ask-title">
  <form id="ask-form">
    <div class="dialog-head"><h2 id="ask-title"></h2></div>
    <div class="ask-body">
      <p class="muted" id="ask-note"></p>
      <label class="sr-only" for="ask-input">Path</label>
      <input id="ask-input" type="text" class="mono-input" spellcheck="false" autocomplete="off">
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="ask-ok">Save</button>
      <button type="button" class="btn" id="ask-cancel">Cancel</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
