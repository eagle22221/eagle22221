name: Windows test

# Builds vex's Windows programs and runs them on a real Windows machine. The
# environment vex is developed in cannot run Windows programs, so this is
# where they are checked. It runs only when the trigger file changes, or when
# started by hand from the Actions page.
on:
  push:
    branches: ["claude/reverse-engineering-program-8jyqqk"]
    paths: [".github/windows-test-trigger"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (cross-compiled on Linux, as releases are)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the Windows cross-compiler
        run: sudo apt-get update -q && sudo apt-get install -y -q mingw-w64
      - name: Fetch the WebView2 SDK
        run: sh c/fetch_webview2.sh
      - name: Build the native-window probe
        run: |
          mkdir -p out
          x86_64-w64-mingw32-gcc -O2 -std=c11 -Wall -Wextra -Werror \
            -Ic/src -Ic/third_party/webview2 -static -s -mwindows \
            -o out/appwin-probe.exe c/tools/appwin_probe.c c/src/appwin.c c/src/window.c \
            -lole32 -luuid
          cp c/third_party/webview2/WebView2Loader.dll out/
      - uses: actions/upload-artifact@v4
        with:
          name: vex-windows
          path: out/
          retention-days: 7

  test:
    name: Run on Windows
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vex-windows
          path: vex-windows
      - name: Run the programs
        shell: pwsh
        run: ./c/tests/windows_smoke.ps1 -Dir vex-windows -Out smoke-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: smoke-output/
          retention-days: 7
